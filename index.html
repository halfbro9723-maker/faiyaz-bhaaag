<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bhaag Faiyaz Bhaag...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050e05;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- UI OVERLAYS --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            transition: opacity 0.2s ease;
        }

        .dialog-box {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 20px;
            width: 88%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border: 4px solid #b72b2b;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #b72b2b;
            font-size: 1.45rem;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .instructions {
            background: #fdf2f2;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.82rem;
            color: #444;
            margin-bottom: 16px;
            line-height: 1.5;
            text-align: left;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn {
            background: linear-gradient(180deg, #d33838 0%, #a21c1c 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(211, 56, 56, 0.4);
            transition: transform 0.1s;
            width: 100%;
        }

        .btn-secondary {
            background: #495057;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .btn:active {
            transform: scale(0.96);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid #ced4da;
            margin: 10px 0 16px 0;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #b72b2b;
        }

        .leaderboard-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 12px 0 16px 0;
            text-align: left;
            border-radius: 8px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 0.88rem;
            border-bottom: 1px solid #dee2e6;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-item.highlight {
            background: #ffe3e3;
            font-weight: bold;
            color: #b72b2b;
        }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
            pointer-events: none;
        }

        .hud-badge {
            background: rgba(0, 0, 0, 0.6);
            color: #ffeb3b;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(3px);
        }

        .lives-badge {
            color: #ff3b30;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-badge" id="hud-distance">📍 0 m</div>
        <div class="hud-badge lives-badge" id="hud-lives">❤️❤️❤️</div>
    </div>

    <!-- START MODAL -->
    <div id="start-menu" class="overlay">
        <div class="dialog-box">
            <h1>Bhaag Faiyaz Bhaag</h1>
            <div class="instructions">
                <strong>Mobile:</strong> Swipe Left/Right to Dodge, Swipe Up to Jump.<br>
                <strong>Desktop:</strong> Arrow Keys / A & D, Spacebar to Jump.<br><br>
                ⚠️ <em>Jump over Rocks. Walls will stop you dead!</em>
            </div>
            <div class="btn-group">
                <button id="btn-start" class="btn">RUN!</button>
                <button id="btn-open-leaderboard" class="btn btn-secondary">LEADERBOARD</button>
            </div>
        </div>
    </div>

    <!-- NAME ENTRY MODAL -->
    <div id="name-modal" class="overlay hidden">
        <div class="dialog-box">
            <h1>New Run!</h1>
            <p style="font-size: 0.9rem; color: #495057;">Enter your name for the leaderboard:</p>
            <input type="text" id="player-name-input" maxlength="12" placeholder="Your Name">
            <button id="btn-save-name" class="btn">SAVE & CONTINUE</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="game-over-menu" class="overlay hidden">
        <div class="dialog-box">
            <h1 style="color: #333;">CAUGHT!</h1>
            <p style="font-size: 1rem; color: #666; margin-bottom: 4px;">Final Distance: <strong id="final-dist" style="color: #b72b2b;">0 m</strong></p>
            <p style="font-size: 0.85rem; color: #868e96; margin-bottom: 16px;">Best: <strong id="best-dist">0 m</strong></p>
            <div class="btn-group">
                <button id="btn-restart" class="btn">PLAY AGAIN</button>
                <button id="btn-show-lb" class="btn btn-secondary">LEADERBOARD</button>
            </div>
        </div>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div id="leaderboard-menu" class="overlay hidden">
        <div class="dialog-box">
            <h1>Leaderboard</h1>
            <div class="leaderboard-list" id="leaderboard-content"></div>
            <button id="btn-close-lb" class="btn">BACK</button>
        </div>
    </div>

    <!-- THREE.JS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* ==========================================================
           1. ASSET CONFIGURATIONS
           ========================================================== */
        const TextureConfig = {
            playerFaceUrl: "textures/player_face.png",
            guardFaceUrl:  "textures/guard_face.png",
            roadUrl:       "textures/road_texture.png",
            rockUrl:       "textures/rock_texture.png",
            wallUrl:       "textures/wall_texture.png"
        };

        const AudioConfig = {
            introAudioUrl:  "sfx/intro.mp3",
            swipeAudioUrl:  "sfx/swipe.mp3",
            jumpAudioUrl:   "sfx/jump.mp3",
            hit1AudioUrl:   "sfx/hit1.mp3",
            hit2AudioUrl:   "sfx/hit2.mp3",
            wallAudioUrl:   "sfx/wall_crash.mp3",
            caughtAudioUrl: "sfx/caught.mp3"
        };

        /* ==========================================================
           2. TEXTURE LOADER & FALLBACKS
           ========================================================== */
        const textureLoader = new THREE.TextureLoader();

        function loadTextureSafe(url, fallbackCanvasCallback) {
            if (url) {
                return textureLoader.load(
                    url,
                    (t) => { t.needsUpdate = true; },
                    undefined,
                    () => { console.warn(`Could not load ${url}, using fallback.`); }
                );
            }
            return fallbackCanvasCallback ? fallbackCanvasCallback() : null;
        }

        function createFaceTexture(label, bgColor = '#ffe0bd') {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(38, 45, 8, 0, Math.PI * 2);
            ctx.arc(90, 45, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(64, 75, 25, 0.2, Math.PI - 0.2);
            ctx.stroke();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, 64, 115);
            return new THREE.CanvasTexture(canvas);
        }

        const loadedTextures = {
            playerFace: loadTextureSafe(TextureConfig.playerFaceUrl, () => createFaceTexture('PLAYER', '#ffdfbe')),
            guardFace:  loadTextureSafe(TextureConfig.guardFaceUrl, () => createFaceTexture('GUARD', '#dfbe9f')),
            road:       loadTextureSafe(TextureConfig.roadUrl, null),
            rock:       loadTextureSafe(TextureConfig.rockUrl, null),
            wall:       loadTextureSafe(TextureConfig.wallUrl, null)
        };

        if (loadedTextures.road) {
            loadedTextures.road.wrapS = THREE.RepeatWrapping;
            loadedTextures.road.wrapT = THREE.RepeatWrapping;
            loadedTextures.road.repeat.set(1, 10);
        }

        /* ==========================================================
           3. AUDIO MANAGER (NO STACKING + PRIORITY OVERRIDE)
           ========================================================== */
        const AUDIO_PRIORITY = { LOW: 1, HIGH: 2 };

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.currentAudio = null;
                this.currentPriority = 0;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            stopCurrent() {
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                    this.currentAudio = null;
                }
                this.currentPriority = 0;
            }

            playSound(url, priority, fallbackFreq = 220, type = 'sine', duration = 0.15, onEnded = null) {
                if (priority < this.currentPriority) return;

                this.stopCurrent();
                this.currentPriority = priority;

                let finished = false;
                const done = () => {
                    if (!finished) {
                        finished = true;
                        this.currentPriority = 0;
                        this.currentAudio = null;
                        if (onEnded) onEnded();
                    }
                };

                if (url) {
                    const audio = new Audio(url);
                    this.currentAudio = audio;
                    audio.onended = done;
                    audio.onerror = () => {
                        this.playBeep(fallbackFreq, type, duration);
                        setTimeout(done, duration * 1000);
                    };
                    audio.play().catch(() => {
                        this.playBeep(fallbackFreq, type, duration);
                        setTimeout(done, duration * 1000);
                    });
                } else {
                    this.playBeep(fallbackFreq, type, duration);
                    setTimeout(done, duration * 1000);
                }
            }

            playBeep(freq, type, duration, gainVal = 0.2) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playJump() { this.playSound(AudioConfig.jumpAudioUrl, AUDIO_PRIORITY.LOW, 350, 'sine', 0.15); }
            playSwipe() { this.playSound(AudioConfig.swipeAudioUrl, AUDIO_PRIORITY.LOW, 220, 'triangle', 0.08); }
            playHit(hitIndex) {
                const urls = [AudioConfig.hit1AudioUrl, AudioConfig.hit2AudioUrl, AudioConfig.caughtAudioUrl];
                this.playSound(urls[hitIndex - 1], AUDIO_PRIORITY.HIGH, 120 - hitIndex * 20, 'sawtooth', 0.4);
            }
            playWallCrash() { this.playSound(AudioConfig.wallAudioUrl, AUDIO_PRIORITY.HIGH, 60, 'sawtooth', 0.6); }
            playIntro(onComplete) { this.playSound(AudioConfig.introAudioUrl, AUDIO_PRIORITY.HIGH, 180, 'sine', 2.0, onComplete); }
            playCaught(onComplete) { this.playSound(AudioConfig.caughtAudioUrl, AUDIO_PRIORITY.HIGH, 80, 'sawtooth', 1.5, onComplete); }
        }

        const soundManager = new SoundFX();

        /* ==========================================================
           4. CLEAN LEADERBOARD (KAIF ONLY INITIALLY)
           ========================================================== */
        class LeaderboardSystem {
            constructor() {
                this.STORAGE_KEY_LB = 'bfb_leaderboard_custom_v1';
                this.STORAGE_KEY_USER = 'bfb_player_tag_v1';
                this.initialData = [
                    { name: "kaif", score: "372846281271001823" }
                ];
            }

            getPlayerName() {
                return localStorage.getItem(this.STORAGE_KEY_USER) || '';
            }

            setPlayerName(name) {
                if (name && name.trim()) {
                    localStorage.setItem(this.STORAGE_KEY_USER, name.trim());
                }
            }

            getScores() {
                try {
                    const local = localStorage.getItem(this.STORAGE_KEY_LB);
                    return local ? JSON.parse(local) : this.initialData;
                } catch {
                    return this.initialData;
                }
            }

            saveScore(name, scoreNum) {
                if (!name) return;
                let list = this.getScores();
                const existing = list.find(item => item.name.toLowerCase() === name.toLowerCase());

                if (existing) {
                    if (Number(scoreNum) > Number(existing.score)) {
                        existing.score = String(scoreNum);
                    }
                } else {
                    list.push({ name: name.trim(), score: String(scoreNum) });
                }

                list.sort((a, b) => (BigInt(b.score) > BigInt(a.score) ? 1 : -1));
                localStorage.setItem(this.STORAGE_KEY_LB, JSON.stringify(list));
            }

            getHighScore(name) {
                if (!name) return 0;
                const list = this.getScores();
                const record = list.find(item => item.name.toLowerCase() === name.toLowerCase());
                return record ? record.score : 0;
            }

            render(containerId, activeName = '') {
                const container = document.getElementById(containerId);
                const list = this.getScores();
                container.innerHTML = '';

                list.forEach((entry, idx) => {
                    const row = document.createElement('div');
                    row.className = 'leaderboard-item';
                    if (activeName && entry.name.toLowerCase() === activeName.toLowerCase()) {
                        row.classList.add('highlight');
                    }

                    const rankIcon = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
                    row.innerHTML = `
                        <span>${rankIcon} <strong>${entry.name}</strong></span>
                        <span style="font-weight:bold; color:#b72b2b;">${entry.score} m</span>
                    `;
                    container.appendChild(row);
                });
            }
        }

        const leaderboard = new LeaderboardSystem();

        /* ==========================================================
           5. GAME ENGINE & ORIGINAL SKY/LIGHTING
           ========================================================== */
        const LANES = [-2.0, 0, 2.0];
        const CHUNK_LENGTH = 50;
        const NUM_CHUNKS = 4;
        const GRAVITY = -24;
        const JUMP_VELOCITY = 8.5;

        let scene, camera, renderer;
        let player, guard;
        let groundChunks = [];
        let obstacles = [];

        let isRunning = false;
        let isIntroActive = false;
        let distanceTravelled = 0;
        let currentSpeed = 16;
        let targetLane = 1; 
        let playerY = 0;
        let playerVY = 0;
        let isGrounded = true;
        let lives = 3;
        let clock = new THREE.Clock();

        function updateCameraView() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;

            if (aspect < 1) {
                camera.fov = 72;
                camera.position.set(0, 4.3, 6.2);
                camera.lookAt(0, 1.2, -6.5);
            } else {
                camera.fov = 55;
                camera.position.set(0, 3.8, 5.5);
                camera.lookAt(0, 1.2, -6);
            }
            camera.updateProjectionMatrix();
        }

        function initScene() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();

            // Original clean sky blue background and atmospheric distance fog
            scene.background = new THREE.Color(0x7ec0ee);
            scene.fog = new THREE.Fog(0x7ec0ee, 25, 85);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
            updateCameraView();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting from original
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d7030, 0.7);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildEnvironment();
            buildCharacters();
            setupControls();

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                updateCameraView();
            });
        }

        /* ==========================================================
           6. CHARACTER BUILDER
           ========================================================== */
        function createCharacter(faceTexture, clothColor) {
            const group = new THREE.Group();

            // Head Cube (Front textured with provided face)
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const faceMat = new THREE.MeshLambertMaterial({ map: faceTexture });
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdfbe });
            const headMats = [skinMat, skinMat, skinMat, skinMat, faceMat, skinMat];
            const head = new THREE.Mesh(headGeo, headMats);
            head.position.y = 1.35;
            head.castShadow = true;
            group.add(head);

            // Torso
            const torsoGeo = new THREE.BoxGeometry(0.6, 0.7, 0.35);
            const torsoMat = new THREE.MeshLambertMaterial({ color: clothColor });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 0.8;
            torso.castShadow = true;
            group.add(torso);

            // Limbs
            const limbGeo = new THREE.BoxGeometry(0.18, 0.55, 0.2);
            const limbMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

            const leftLeg = new THREE.Mesh(limbGeo, limbMat);
            leftLeg.position.set(-0.18, 0.28, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(limbGeo, limbMat);
            rightLeg.position.set(0.18, 0.28, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);

            const leftArm = new THREE.Mesh(limbGeo, torsoMat);
            leftArm.position.set(-0.4, 0.8, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = new THREE.Mesh(limbGeo, torsoMat);
            rightArm.position.set(0.4, 0.8, 0);
            rightArm.castShadow = true;
            group.add(rightArm);

            group.userData = { leftLeg, rightLeg, leftArm, rightArm, head };
            return group;
        }

        function buildCharacters() {
            player = createCharacter(loadedTextures.playerFace, 0xe07a2d);
            scene.add(player);

            guard = createCharacter(loadedTextures.guardFace, 0x223344);
            guard.position.set(0, 0, 3.5);
            scene.add(guard);
        }

        /* ==========================================================
           7. TRACK & ENVIRONMENT
           ========================================================== */
        function createTree() {
            const tree = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.2, 5);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.6;
            tree.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(1.1, 2.2, 5);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2e8b3e });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 2.0;
            tree.add(leaves);

            return tree;
        }

        function createTrackChunk(zPos) {
            const chunk = new THREE.Group();

            const roadGeo = new THREE.PlaneGeometry(6.6, CHUNK_LENGTH);
            const roadMat = loadedTextures.road 
                ? new THREE.MeshLambertMaterial({ map: loadedTextures.road })
                : new THREE.MeshLambertMaterial({ color: 0xd4d8db });
            
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            chunk.add(road);

            const grassGeo = new THREE.PlaneGeometry(30, CHUNK_LENGTH);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x4aa338 });
            
            const leftGrass = new THREE.Mesh(grassGeo, grassMat);
            leftGrass.rotation.x = -Math.PI / 2;
            leftGrass.position.x = -18.3;
            leftGrass.receiveShadow = true;
            chunk.add(leftGrass);

            const rightGrass = new THREE.Mesh(grassGeo, grassMat);
            rightGrass.rotation.x = -Math.PI / 2;
            rightGrass.position.x = 18.3;
            rightGrass.receiveShadow = true;
            chunk.add(rightGrass);

            for (let i = -CHUNK_LENGTH / 2; i < CHUNK_LENGTH / 2; i += 7) {
                const treeL = createTree();
                treeL.position.set(-4.8 - Math.random() * 3, 0, i);
                chunk.add(treeL);

                const treeR = createTree();
                treeR.position.set(4.8 + Math.random() * 3, 0, i);
                chunk.add(treeR);
            }

            chunk.position.z = zPos;
            scene.add(chunk);
            return chunk;
        }

        function buildEnvironment() {
            for (let i = 0; i < NUM_CHUNKS; i++) {
                groundChunks.push(createTrackChunk(-i * CHUNK_LENGTH));
            }
        }

        /* ==========================================================
           8. OBSTACLES & CONTROLS
           ========================================================== */
        function spawnObstacle(zDistance) {
            const laneIndex = Math.floor(Math.random() * 3);
            const laneX = LANES[laneIndex];
            const isWall = Math.random() > 0.55;

            let mesh;
            if (isWall) {
                const wallGeo = new THREE.BoxGeometry(1.8, 2.2, 0.4);
                const wallMat = loadedTextures.wall
                    ? new THREE.MeshLambertMaterial({ map: loadedTextures.wall })
                    : new THREE.MeshLambertMaterial({ color: 0xb53838 });
                mesh = new THREE.Mesh(wallGeo, wallMat);
                mesh.position.set(laneX, 1.1, zDistance);
                mesh.userData = { type: 'wall', jumpable: false };
            } else {
                const rockGeo = new THREE.DodecahedronGeometry(0.65);
                const rockMat = loadedTextures.rock
                    ? new THREE.MeshLambertMaterial({ map: loadedTextures.rock })
                    : new THREE.MeshLambertMaterial({ color: 0x6e7275 });
                mesh = new THREE.Mesh(rockGeo, rockMat);
                mesh.position.set(laneX, 0.45, zDistance);
                mesh.scale.set(1.2, 0.8, 1.0);
                mesh.userData = { type: 'rock', jumpable: true };
            }

            mesh.castShadow = true;
            scene.add(mesh);
            obstacles.push(mesh);
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if (!isRunning) return;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLane(-1);
                if (e.code === 'ArrowRight' || e.code === 'KeyD') moveLane(1);
                if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') doJump();
                if (e.code === 'ArrowDown' || e.code === 'KeyS') fastDrop();
            });

            let startX = 0, startY = 0;
            window.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (!isRunning) return;
                const deltaX = e.changedTouches[0].clientX - startX;
                const deltaY = e.changedTouches[0].clientY - startY;
                const absX = Math.abs(deltaX);
                const absY = Math.abs(deltaY);

                if (Math.max(absX, absY) > 25) {
                    if (absX > absY) {
                        if (deltaX > 0) moveLane(1);
                        else moveLane(-1);
                    } else {
                        if (deltaY < 0) doJump();
                        else fastDrop();
                    }
                }
            }, { passive: true });
        }

        function moveLane(dir) {
            const nextLane = targetLane + dir;
            if (nextLane >= 0 && nextLane <= 2) {
                targetLane = nextLane;
                soundManager.playSwipe();
            }
        }

        function doJump() {
            if (isGrounded) {
                playerVY = JUMP_VELOCITY;
                isGrounded = false;
                soundManager.playJump();
            }
        }

        function fastDrop() {
            if (!isGrounded) {
                playerVY = -14;
            }
        }

        /* ==========================================================
           9. GAME LIFECYCLE & UI FLOW
           ========================================================== */
        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const leaderboardMenu = document.getElementById('leaderboard-menu');
        const nameModal = document.getElementById('name-modal');
        const hud = document.getElementById('hud');

        document.getElementById('btn-start').addEventListener('click', () => {
            soundManager.init();
            startMenu.classList.add('hidden');
            hud.classList.remove('hidden');
            startGame();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            gameOverMenu.classList.add('hidden');
            startGame();
        });

        document.getElementById('btn-open-leaderboard').addEventListener('click', () => {
            leaderboard.render('leaderboard-content', leaderboard.getPlayerName());
            startMenu.classList.add('hidden');
            leaderboardMenu.classList.remove('hidden');
        });

        document.getElementById('btn-show-lb').addEventListener('click', () => {
            leaderboard.render('leaderboard-content', leaderboard.getPlayerName());
            gameOverMenu.classList.add('hidden');
            leaderboardMenu.classList.remove('hidden');
        });

        document.getElementById('btn-close-lb').addEventListener('click', () => {
            leaderboardMenu.classList.add('hidden');
            if (lives <= 0) {
                gameOverMenu.classList.remove('hidden');
            } else {
                startMenu.classList.remove('hidden');
            }
        });

        document.getElementById('btn-save-name').addEventListener('click', () => {
            const inputName = document.getElementById('player-name-input').value.trim();
            if (inputName) {
                leaderboard.setPlayerName(inputName);
                const score = Math.floor(distanceTravelled);
                leaderboard.saveScore(inputName, score);
                nameModal.classList.add('hidden');
                displayGameOverMenu();
            }
        });

        function startGame() {
            lives = 3;
            currentSpeed = 15;
            distanceTravelled = 0;
            targetLane = 1;
            playerY = 0;
            playerVY = 0;
            isGrounded = true;
            isIntroActive = true;
            isRunning = true;
            updateLivesUI();

            player.position.set(LANES[targetLane], 0, 0);
            guard.position.set(LANES[targetLane], 0, 3.5);

            for (let obs of obstacles) scene.remove(obs);
            obstacles = [];

            soundManager.playIntro(() => {
                isIntroActive = false;
            });
        }

        function handleObstacleHit(obs) {
            scene.remove(obs);
            obstacles.splice(obstacles.indexOf(obs), 1);

            if (obs.userData.type === 'wall') {
                lives = 0;
                updateLivesUI();
                soundManager.playWallCrash();
                triggerGameOver();
            } else {
                lives--;
                updateLivesUI();
                const hitIndex = 3 - lives;
                soundManager.playHit(hitIndex);

                if (lives <= 0) {
                    triggerGameOver();
                }
            }
        }

        function triggerGameOver() {
            isRunning = false;
            guard.position.z = player.position.z + 0.5;
            guard.position.x = player.position.x;

            soundManager.playCaught(() => {
                const finalScore = Math.floor(distanceTravelled);
                const savedName = leaderboard.getPlayerName();

                if (!savedName) {
                    nameModal.classList.remove('hidden');
                } else {
                    leaderboard.saveScore(savedName, finalScore);
                    displayGameOverMenu();
                }
            });
        }

        function displayGameOverMenu() {
            const finalScore = Math.floor(distanceTravelled);
            const savedName = leaderboard.getPlayerName();
            const bestScore = leaderboard.getHighScore(savedName);

            document.getElementById('final-dist').innerText = `${finalScore} m`;
            document.getElementById('best-dist').innerText = `${Math.max(finalScore, Number(bestScore))} m`;
            gameOverMenu.classList.remove('hidden');
        }

        function updateLivesUI() {
            const hearts = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
            document.getElementById('hud-lives').innerText = hearts;
        }

        /* ==========================================================
           10. ANIMATION LOOP
           ========================================================== */
        let nextSpawnDist = 30;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (isRunning) {
                currentSpeed += delta * 0.08;
                const moveDist = currentSpeed * delta;
                distanceTravelled += moveDist;
                document.getElementById('hud-distance').innerText = `📍 ${Math.floor(distanceTravelled)} m`;

                const targetX = LANES[targetLane];
                player.position.x += (targetX - player.position.x) * 14 * delta;

                if (!isGrounded) {
                    playerVY += GRAVITY * delta;
                    playerY += playerVY * delta;
                    if (playerY <= 0) {
                        playerY = 0;
                        playerVY = 0;
                        isGrounded = true;
                    }
                }
                player.position.y = playerY;

                const targetGuardZ = lives === 3 ? 3.5 : (lives === 2 ? 2.2 : 1.2);
                guard.position.z += (targetGuardZ - guard.position.z) * 4 * delta;
                guard.position.x += (player.position.x - guard.position.x) * 10 * delta;
                guard.position.y = playerY * 0.5;

                const runCycle = Math.sin(time * currentSpeed * 1.2);
                player.userData.leftLeg.rotation.x = runCycle * 0.6;
                player.userData.rightLeg.rotation.x = -runCycle * 0.6;
                player.userData.leftArm.rotation.x = -runCycle * 0.6;
                player.userData.rightArm.rotation.x = runCycle * 0.6;

                guard.userData.leftLeg.rotation.x = runCycle * 0.7;
                guard.userData.rightLeg.rotation.x = -runCycle * 0.7;
                guard.userData.leftArm.rotation.x = -runCycle * 0.7;
                guard.userData.rightArm.rotation.x = runCycle * 0.7;

                for (let chunk of groundChunks) {
                    chunk.position.z += moveDist;
                    if (chunk.position.z > CHUNK_LENGTH) {
                        chunk.position.z -= NUM_CHUNKS * CHUNK_LENGTH;
                    }
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += moveDist;

                    const dz = Math.abs(obs.position.z - player.position.z);
                    const dx = Math.abs(obs.position.x - player.position.x);

                    if (dz < 0.65 && dx < 0.7) {
                        if (obs.userData.jumpable && player.position.y > 0.75) {
                            // Cleared
                        } else {
                            handleObstacleHit(obs);
                            continue;
                        }
                    }

                    if (obs.position.z > 6) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                if (!isIntroActive) {
                    nextSpawnDist -= moveDist;
                    if (nextSpawnDist <= 0) {
                        spawnObstacle(-55);
                        nextSpawnDist = 18 + Math.random() * 12;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = () => {
            initScene();
            animate();
        };
    </script>
</body>
</html>
